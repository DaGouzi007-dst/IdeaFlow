[project]
name = "ideaflow-progressgate"
version = "0.1.0"
description = "IdeaFlow 决策与任务跟踪模块的本地开发版本"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.115,<1.0",
    "sqlmodel>=0.0.24,<0.1",
    "uvicorn>=0.34,<1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8,<10",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
